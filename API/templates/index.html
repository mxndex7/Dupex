
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dupex - Duplicatas Escriturais</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #b4b4b4 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            backdrop-filter: blur(10px);
        }
        
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        
    
        
        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 700;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
            font-weight: 400;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        
        .section {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #f0f0f0;
        }
        
        .section:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.15);
        }
        
        .section h2 {
            color: #dd1d10;
            margin-bottom: 25px;
            font-size: 1.4em;
            font-weight: 600;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 0.95em;
        }
        
        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #ca1313;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        button {
            width: 100%;
            background: linear-gradient(135deg, #b11010 0%, #ad4211 100%);
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(214, 21, 21, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .response {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #d31010;
            display: none;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .response.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .response pre {
            margin: 0;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #333;
        }
        
        .success {
            border-left-color: #28a745;
            background: #f0fdf4;
        }
        
        .error {
            border-left-color: #dc3545;
            background: #fef2f2;
        }
        
        /* Scrollbar personalizada */
        .response::-webkit-scrollbar {
            width: 8px;
        }
        
        .response::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .response::-webkit-scrollbar-thumb {
            background: #d31010;
            border-radius: 10px;
        }
        
        .response::-webkit-scrollbar-thumb:hover {
            background: #d31010;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
         
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Dupex - Sistema de Duplicatas Escriturais</h1>
            <p class="subtitle">API de duplicatas digitais</p>
        </div>

        <div class="grid">
            <!-- Criar Duplicata -->
            <div class="section">
                <h2>Criar Duplicata</h2>
                <div class="form-group">
                    <label>Número:</label>
                    <input type="text" id="numero" placeholder="DUP-001" value="DUP-001">
                </div>
                <div class="form-group">
                    <label>Valor (R$):</label>
                    <input type="number" id="valor" placeholder="1500.00" value="1500.00" step="0.01">
                </div>
                <div class="form-group">
                    <label>Emitente:</label>
                    <input type="text" id="emitente" placeholder="Empresa XYZ Ltda" value="Empresa XYZ Ltda">
                </div>
                <div class="form-group">
                    <label>Sacado:</label>
                    <input type="text" id="sacado" placeholder="Cliente ABC S.A." value="Cliente ABC S.A.">
                </div>
                <div class="form-group">
                    <label>Data Vencimento:</label>
                    <input type="date" id="data_vencimento" value="2024-12-31">
                </div>
                <button onclick="criarDuplicata()">Criar Duplicata</button>
                <div id="response-criar" class="response"></div>
            </div>

            <!-- Listar Duplicatas -->
            <div class="section">
                <h2>Listar Duplicatas</h2>
                <div class="form-group">
                    <label>Filtrar por Status:</label>
                    <select id="filtro-status">
                        <option value="">Todos</option>
                        <option value="emitida">Emitida</option>
                        <option value="aceita">Aceita</option>
                        <option value="liquidada">Liquidada</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                </div>
                <button onclick="listarDuplicatas()">Listar Todas</button>
                <div id="response-listar" class="response"></div>
            </div>

            <!-- Buscar por ID -->
            <div class="section">
                <h2>Buscar Duplicata</h2>
                <div class="form-group">
                    <label>ID da Duplicata:</label>
                    <input type="number" id="buscar-id" placeholder="1" value="1">
                </div>
                <button onclick="buscarDuplicata()">Buscar por ID</button>
                <div id="response-buscar" class="response"></div>
            </div>

            <!-- Atualizar Status -->
            <div class="section">
                <h2>Atualizar Status</h2>
                <div class="form-group">
                    <label>ID da Duplicata:</label>
                    <input type="number" id="atualizar-id" placeholder="1" value="1">
                </div>
                <div class="form-group">
                    <label>Novo Status:</label>
                    <select id="novo-status">
                        <option value="emitida">Emitida</option>
                        <option value="aceita">Aceita</option>
                        <option value="liquidada">Liquidada</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                </div>
                <button onclick="atualizarStatus()">Atualizar Status</button>
                <div id="response-atualizar" class="response"></div>
            </div>

            <!-- Excluir Duplicata -->
            <div class="section">
                <h2>Excluir Duplicata</h2>
                <div class="form-group">
                    <label>ID da Duplicata:</label>
                    <input type="number" id="excluir-id" placeholder="1" value="1">
                </div>
                <button onclick="excluirDuplicata()">Excluir Permanentemente</button>
                <div id="response-excluir" class="response"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;

        function showResponse(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            element.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            element.className = 'response show ' + (isError ? 'error' : 'success');
        }

        async function criarDuplicata() {
            try {
                const response = await fetch(`${API_URL}/duplicatas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        numero: document.getElementById('numero').value,
                        valor: parseFloat(document.getElementById('valor').value),
                        emitente: document.getElementById('emitente').value,
                        sacado: document.getElementById('sacado').value,
                        data_vencimento: document.getElementById('data_vencimento').value
                    })
                });
                const data = await response.json();
                showResponse('response-criar', data, !response.ok);
            } catch (error) {
                showResponse('response-criar', { erro: error.message }, true);
            }
        }

        async function listarDuplicatas() {
            try {
                const status = document.getElementById('filtro-status').value;
                const url = status ? `${API_URL}/duplicatas?status=${status}` : `${API_URL}/duplicatas`;
                const response = await fetch(url);
                const data = await response.json();
                showResponse('response-listar', data, !response.ok);
            } catch (error) {
                showResponse('response-listar', { erro: error.message }, true);
            }
        }

        async function buscarDuplicata() {
            try {
                const id = document.getElementById('buscar-id').value;
                const response = await fetch(`${API_URL}/duplicatas/${id}`);
                const data = await response.json();
                showResponse('response-buscar', data, !response.ok);
            } catch (error) {
                showResponse('response-buscar', { erro: error.message }, true);
            }
        }

        async function atualizarStatus() {
            try {
                const id = document.getElementById('atualizar-id').value;
                const status = document.getElementById('novo-status').value;
                const response = await fetch(`${API_URL}/duplicatas/${id}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: status })
                });
                const data = await response.json();
                showResponse('response-atualizar', data, !response.ok);
            } catch (error) {
                showResponse('response-atualizar', { erro: error.message }, true);
            }
        }

        async function excluirDuplicata() {
            try {
                const id = document.getElementById('excluir-id').value;
                const response = await fetch(`${API_URL}/duplicatas/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                showResponse('response-excluir', data, !response.ok);
            } catch (error) {
                showResponse('response-excluir', { erro: error.message }, true);
            }
        }
    </script>
</body>
</html>
